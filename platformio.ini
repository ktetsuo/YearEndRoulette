[env:m5atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
	MsgPacketizer @ 0.5.3
	m5stack/M5GFX @ 0.2.20
	https://github.com/m5stack/M5Unit-Roller

[env:native]
platform = native
test_filter = test_roulette_calc
